[pytest]
markers =
    live_db: exercises the real production database (data/stockbot.db) as a
        point-in-time audit, not a deterministic regression test -- its
        result depends on what's actually been ingested/computed so far.
        Excluded from the default run (see README) and from CI, which has
        no production database to check. Run explicitly with
        `-m live_db` against a real checkout to audit the live pipeline.
