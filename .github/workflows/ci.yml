name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pipeline-tests:
    name: Pipeline (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt
      - name: pytest (isolated tests only -- CI has no production database)
        run: python -m pytest pipeline/tests -q -m "not live_db"

  web-tests:
    name: Web (vitest, eslint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: eslint
        working-directory: web
        run: npm run lint
      - name: vitest
        working-directory: web
        run: npm test
      - name: next build
        working-directory: web
        run: npm run build

  public-site-tests:
    name: Public site (eslint, build, node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: public-site/package-lock.json
      - name: Install public-site dependencies
        working-directory: public-site
        run: npm ci
      - name: eslint
        working-directory: public-site
        run: npm run lint
      - name: build + test
        working-directory: public-site
        run: npm test
